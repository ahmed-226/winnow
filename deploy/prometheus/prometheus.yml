global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Ingest and document-embedding counters are only exported by the worker.
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]
