[project]
name = "rag-engine"
version = "0.1.0"
description = "Multi-tenant hybrid search and retrieval backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "beautifulsoup4>=4.12",
    "boto3>=1.35",
    "fastapi>=0.115",
    "filetype>=1.2",
    "google-genai>=1.0",
    "pgvector>=0.3.6",
    "prometheus-fastapi-instrumentator>=7.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "pyjwt>=2.10",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "trafilatura>=2.0",
    "uvicorn[standard]>=0.32",
    "email-validator>=2.2",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "httpx>=0.28",
    "moto[s3]>=5",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: calls real external services (Gemini); opt-in only",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_reexport = true
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "filetype", "pymupdf"]
ignore_missing_imports = true
